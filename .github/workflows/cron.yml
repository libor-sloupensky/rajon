name: Cron (scraping zdrojů)

# Náhrada za cron hostingu — spouští pravidelný scraping aktivních zdrojů.
# Zapíná se proměnnou CRON_ENABLED=1 (Settings → Variables → Actions),
# aby šla plánovaná úloha vypnout bez commitu.
# Pozor: GitHub plánované workflow uspí po 60 dnech bez aktivity v repu.

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  cron:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ vars.CRON_ENABLED == '1' }}

    steps:
    - name: Scraping aktivních zdrojů
      env:
        SITE_URL: ${{ vars.APP_URL || 'https://rajon.tuptudu.cz' }}
        CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
      run: |
        curl -sS --max-time 900 "$SITE_URL/cron.php?token=$CRON_TOKEN" || echo "cron selhal"
