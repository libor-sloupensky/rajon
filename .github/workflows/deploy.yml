name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Serializace deployů: kdyby pushovaly dvě AI/procesy naráz, deploye se zařadí
# do fronty (jeden po druhém) místo závodění o server _deploy/ adresář.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  APP_DIR: /tuptudu.cz/rajon
  PUBLIC_DIR: /tuptudu.cz/_sub/rajon

jobs:
  deploy:
    name: Build & Deploy via FTP
    runs-on: ubuntu-latest
    steps:
      # Vypíše veřejnou IP runneru — pro doložení blokace Webglobe (legitimní
      # IP, co se nemůže připojit na FTP). Při selhání deploye = blokovaná IP.
      - name: Runner IP
        run: echo "Runner public IP:"; curl -s --max-time 10 https://api.ipify.org || curl -s --max-time 10 https://ifconfig.me; echo

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANGED="FULL"
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "FULL")
          fi

          if [ "$CHANGED" = "FULL" ]; then
            echo "full_deploy=true" >> $GITHUB_OUTPUT
            echo "vendor_changed=true" >> $GITHUB_OUTPUT
            echo "assets_changed=true" >> $GITHUB_OUTPUT
          else
            echo "$CHANGED"

            if echo "$CHANGED" | grep -qE "^composer\.(json|lock)$"; then
              echo "vendor_changed=true" >> $GITHUB_OUTPUT
            else
              echo "vendor_changed=false" >> $GITHUB_OUTPUT
            fi

            if echo "$CHANGED" | grep -qE "^(package\.json|package-lock\.json|vite\.config\.|resources/(css|js)/)"; then
              echo "assets_changed=true" >> $GITHUB_OUTPUT
            else
              echo "assets_changed=false" >> $GITHUB_OUTPUT
            fi

            echo "full_deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Setup Node.js
        if: steps.changes.outputs.assets_changed == 'true' || steps.changes.outputs.full_deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies and build assets
        if: steps.changes.outputs.assets_changed == 'true' || steps.changes.outputs.full_deploy == 'true'
        run: |
          npm install
          npm run build

      - name: Create .env for production
        run: |
          cat > .env << 'ENVEOF'
          APP_NAME="Rajón"
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_URL=https://rajon.tuptudu.cz
          APP_LOCALE=cs
          APP_FALLBACK_LOCALE=en
          APP_FAKER_LOCALE=cs_CZ
          APP_MAINTENANCE_DRIVER=file
          BCRYPT_ROUNDS=12
          LOG_CHANNEL=stack
          LOG_STACK=daily
          LOG_DAILY_DAYS=60
          LOG_DEPRECATIONS_CHANNEL=null
          LOG_LEVEL=error
          DB_CONNECTION=mysql
          DB_HOST=db.dw328.webglobe.com
          DB_PORT=3306
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_CHARSET=utf8mb4
          DB_COLLATION=utf8mb4_unicode_ci
          SESSION_DRIVER=file
          SESSION_LIFETIME=10080
          SESSION_ENCRYPT=false
          SESSION_PATH=/
          SESSION_DOMAIN=null
          BROADCAST_CONNECTION=log
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=sync
          CACHE_STORE=file
          MAIL_MAILER=smtp
          MAIL_HOST=mail.webglobe.cz
          MAIL_PORT=587
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MAIL_ENCRYPTION=tls
          MAIL_FROM_ADDRESS=festivaly@wormup.com
          MAIL_FROM_NAME="Rajón"
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI=https://rajon.tuptudu.cz/auth/google/callback
          MIGRATE_TOKEN=${{ secrets.MIGRATE_TOKEN }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          MAPYCZ_API_KEY=${{ secrets.MAPYCZ_API_KEY }}
          CRON_TOKEN=${{ secrets.CRON_TOKEN }}
          ENVEOF
          sed -i 's/^          //' .env

      - name: Prepare split deployment structure
        run: |
          mkdir -p deploy-app deploy-public

          # App — vše kromě public/, node_modules/, .git/
          rsync -a --exclude='public/' --exclude='node_modules/' --exclude='.git/' --exclude='.claude/' . deploy-app/

          # Public — obsah public/
          rsync -a public/ deploy-public/

      # Archivní deploy: místo stovek souborů přes FTP zabalíme změny do JEDNOHO
      # .tar.gz na cíl (app/public). Jediné TCP spojení = rychlé a minimální
      # expozice firewallu Webglobe. Rozbalí se na serveru přes public/extract.php.
      - name: Build deploy archives
        id: archives
        run: |
          mkdir -p /tmp/deploy
          APP_HAS=false; PUB_HAS=false

          if [ "${{ steps.changes.outputs.full_deploy }}" = "true" ]; then
            echo "=== FULL — app archiv ==="
            ( cd deploy-app && find . -type f \
                ! -path './storage/logs/*' \
                ! -path './storage/framework/sessions/*' \
                | sed 's|^\./||' > /tmp/deploy/app-files.txt )
            tar czf /tmp/deploy/app.tar.gz -C deploy-app -T /tmp/deploy/app-files.txt
            APP_HAS=true

            echo "=== FULL — public archiv ==="
            ( cd deploy-public && find . -type f | sed 's|^\./||' > /tmp/deploy/pub-files.txt )
            tar czf /tmp/deploy/public.tar.gz -C deploy-public -T /tmp/deploy/pub-files.txt
            PUB_HAS=true
          else
            echo "=== SMART ==="
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)

            # --- APP ---
            : > /tmp/deploy/app-files.txt
            : > /tmp/deploy/delete-app.txt
            echo ".env" >> /tmp/deploy/app-files.txt   # .env není v gitu, posíláme vždy
            for file in $CHANGED_FILES; do
              [[ "$file" == public/* ]] && continue
              if [ -f "deploy-app/$file" ]; then
                echo "$file" >> /tmp/deploy/app-files.txt
                echo "  app +: $file"
              else
                echo "$file" >> /tmp/deploy/delete-app.txt
                echo "  app -: $file"
              fi
            done
            if [ "${{ steps.changes.outputs.vendor_changed }}" = "true" ]; then
              ( cd deploy-app && find vendor -type f | sed 's|^\./||' >> /tmp/deploy/app-files.txt )
            else
              echo "vendor/autoload.php" >> /tmp/deploy/app-files.txt
              ( cd deploy-app && find vendor/composer -type f | sed 's|^\./||' >> /tmp/deploy/app-files.txt )
            fi
            sort -u /tmp/deploy/app-files.txt -o /tmp/deploy/app-files.txt
            if [ -s /tmp/deploy/app-files.txt ]; then
              tar czf /tmp/deploy/app.tar.gz -C deploy-app -T /tmp/deploy/app-files.txt
              APP_HAS=true
            fi
            [ -s /tmp/deploy/delete-app.txt ] && APP_HAS=true

            # --- PUBLIC ---
            : > /tmp/deploy/pub-files.txt
            : > /tmp/deploy/delete-public.txt
            for file in $CHANGED_FILES; do
              [[ "$file" != public/* ]] && continue
              REL="${file#public/}"
              if [ -f "deploy-public/$REL" ]; then
                echo "$REL" >> /tmp/deploy/pub-files.txt
                echo "  public +: $REL"
              else
                echo "$REL" >> /tmp/deploy/delete-public.txt
                echo "  public -: $REL"
              fi
            done
            if [ "${{ steps.changes.outputs.assets_changed }}" = "true" ]; then
              ( cd deploy-public && find build -type f | sed 's|^\./||' >> /tmp/deploy/pub-files.txt )
            fi
            sort -u /tmp/deploy/pub-files.txt -o /tmp/deploy/pub-files.txt
            if [ -s /tmp/deploy/pub-files.txt ]; then
              tar czf /tmp/deploy/public.tar.gz -C deploy-public -T /tmp/deploy/pub-files.txt
              PUB_HAS=true
            fi
            [ -s /tmp/deploy/delete-public.txt ] && PUB_HAS=true
          fi

          echo "app_has=$APP_HAS" >> $GITHUB_OUTPUT
          echo "pub_has=$PUB_HAS" >> $GITHUB_OUTPUT
          echo "--- obsah /tmp/deploy ---"
          ls -la /tmp/deploy/

      - name: Upload archives via lftp FTP
        timeout-minutes: 12
        run: |
          sudo apt-get install -y lftp > /dev/null 2>&1

          # Sestavit seznam put příkazů jen pro existující soubory.
          # Archivy i delete-listy jdou do APP_DIR/_deploy/ (odtud je čte extract.php).
          LFTP_SCRIPT="mkdir -pf ${{ env.APP_DIR }}/_deploy;"
          for f in app.tar.gz public.tar.gz delete-app.txt delete-public.txt; do
            if [ -s "/tmp/deploy/$f" ]; then
              LFTP_SCRIPT="${LFTP_SCRIPT} put -O ${{ env.APP_DIR }}/_deploy/ /tmp/deploy/$f;"
              echo "  upload: $f ($(stat -c%s /tmp/deploy/$f) B)"
            fi
          done

          # Retry smyčka: krátký timeout + ČERSTVÉ spojení při zaseknutí (firewall
          # Webglobe nahodile blokuje IP runneru). Automatizuje ruční "cancel + rerun".
          OK=0
          for attempt in $(seq 1 10); do
            echo ">>> upload archivů, pokus $attempt/10"
            if timeout 120 lftp -e "
              set ftp:ssl-allow no;
              set xfer:clobber on;
              set net:timeout 15;
              set net:max-retries 1;
              set net:reconnect-interval-base 3;
              open ftp://${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}@ftp.tuptudu.cz;
              ${LFTP_SCRIPT}
              quit
            "; then
              OK=1; echo ">>> upload OK (pokus $attempt)"; break
            fi
            echo ">>> Pokus $attempt selhal/timeout, čekám 5 s a zkouším čerstvé spojení…"
            sleep 5
          done
          [ "$OK" = "1" ] || { echo "✗ upload archivů se nepodařil ani po 10 pokusech"; exit 1; }
          echo "=== upload complete ==="

      - name: Extract on server + post-deploy
        timeout-minutes: 10
        run: |
          TOKEN="${{ secrets.MIGRATE_TOKEN }}"

          # Pomocná funkce: zavolat URL s retry (firewall blokuje i HTTP z runneru)
          call() {
            local url="$1" label="$2"
            for attempt in $(seq 1 8); do
              echo ">>> ${label}, pokus $attempt/8"
              if curl -fsSL --max-time 90 "$url"; then
                echo ">>> ${label} OK"; return 0
              fi
              echo ">>> ${label} pokus $attempt selhal, čekám 5 s…"; sleep 5
            done
            echo "✗ ${label} se nepodařil ani po 8 pokusech"; return 1
          }

          if [ "${{ steps.archives.outputs.app_has }}" = "true" ]; then
            call "https://rajon.tuptudu.cz/extract.php?token=${TOKEN}&target=app" "extract app" || exit 1
          fi
          if [ "${{ steps.archives.outputs.pub_has }}" = "true" ]; then
            call "https://rajon.tuptudu.cz/extract.php?token=${TOKEN}&target=public" "extract public" || exit 1
          fi

          # Cache clear + migrace
          call "https://rajon.tuptudu.cz/deploy-hook.php?token=${TOKEN}&migrate" "deploy hook" || exit 1
